<meta charset="UTF-8">

<style>
:root{--by-blue-deep:#081D3F;--by-blue:#0F2E63;--by-sky:#A3BFE9;--by-gold:#D4AF6A;--by-gold-bright:#F0CE8C;--by-ivory:#E6E1D4;--by-white:#EFECE3}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;background:var(--by-blue-deep);color:var(--by-ivory);line-height:1.95;letter-spacing:.012em;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
nav{position:sticky;top:0;z-index:50;background:rgba(8,29,63,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(212,175,106,.22)}
nav::after{content:"";position:absolute;right:0;top:0;bottom:0;width:38px;pointer-events:none;
  background:linear-gradient(90deg,rgba(8,29,63,0),rgba(8,29,63,.95))}
@media(min-width:1100px){nav::after{display:none}}
nav .in{max-width:1180px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:6px;height:56px;overflow-x:auto;scrollbar-width:none}
nav .in::-webkit-scrollbar{display:none}
nav .brand{font-weight:700;color:var(--by-gold);white-space:nowrap;margin-right:14px;letter-spacing:.06em;text-decoration:none}
nav a{color:var(--by-ivory);text-decoration:none;font-size:.94rem;white-space:nowrap;padding:6px 11px;border-radius:999px}
nav a:hover{background:rgba(212,175,106,.16);color:var(--by-gold-bright);opacity:1}
.head{max-width:1180px;margin:0 auto;padding:54px 22px 26px;text-align:center}
.head .k{color:var(--by-gold);letter-spacing:.3em;font-size:.82rem;margin-bottom:12px}
.head h1{font-size:clamp(1.7rem,4.4vw,2.6rem);color:var(--by-white);letter-spacing:.06em}
.head p{margin-top:14px;color:var(--by-sky);font-size:1rem}
.layout{max-width:1180px;margin:0 auto;padding:20px 22px 90px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;align-items:start}
.toc,article{min-width:0}
.toc{position:sticky;top:74px;max-height:calc(100vh - 100px);overflow-y:auto;border:1px solid rgba(143,180,232,.2);border-radius:14px;padding:18px 14px;background:rgba(15,46,99,.36)}
.toc>summary{display:none}
.toc b{display:block;color:var(--by-gold);font-size:.82rem;letter-spacing:.2em;margin-bottom:10px}
.toc a{display:block;color:var(--by-ivory);text-decoration:none;font-size:.92rem;padding:5px 8px;border-radius:7px;line-height:1.55}
.toc a:hover{background:rgba(212,175,106,.14);color:var(--by-gold-bright);opacity:1}
.toc a.l2{padding-left:20px;font-size:.88rem;color:var(--by-sky)}
article{background:rgba(15,46,99,.3);border:1px solid rgba(143,180,232,.18);border-radius:18px;padding:44px 46px}
article h1{font-size:1.9rem;color:var(--by-gold-bright);margin:46px 0 18px;padding-bottom:12px;border-bottom:1px solid rgba(212,175,106,.35);letter-spacing:.05em}
article h1:first-child{margin-top:0}
article h2{font-size:1.4rem;color:var(--by-white);margin:38px 0 14px;letter-spacing:.04em}
article h3{font-size:1.12rem;color:var(--by-sky);margin:26px 0 10px}
article h4{font-size:1rem;color:var(--by-gold);margin:20px 0 8px}
article p{margin:12px 0}
article ul{margin:12px 0 12px 1.3em}
article li{margin:5px 0}
article hr{border:0;border-top:1px solid rgba(143,180,232,.18);margin:38px 0}
blockquote.quote{border-left:3px solid var(--by-gold);background:rgba(212,175,106,.08);padding:14px 20px;margin:18px 0;border-radius:0 10px 10px 0;color:var(--by-white)}
blockquote.src{font-size:.88rem;color:var(--by-sky);margin:10px 0 0;border-left:2px solid rgba(163,191,233,.35);padding-left:12px}
.tw{overflow-x:auto;margin:18px 0;border:1px solid rgba(143,180,232,.2);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:.96rem}
th,td{border-bottom:1px solid rgba(143,180,232,.16);padding:10px 14px;text-align:left;vertical-align:top}
th{background:rgba(15,46,99,.7);color:var(--by-gold-bright);white-space:nowrap}
code{background:rgba(8,29,63,.7);padding:2px 6px;border-radius:5px;font-size:.9em}
footer{border-top:1px solid rgba(212,175,106,.24);padding:40px 22px;text-align:center;color:var(--by-sky);font-size:.9rem;line-height:1.9}

/* ===== 平板／手機 ===== */
@media(max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:18px;padding:14px 18px 70px}
  .head{padding:40px 18px 18px}
  /* 目次在小螢幕收合成可展開清單，不佔版面 */
  .toc{position:static;max-height:none;overflow:visible;padding:0;background:rgba(15,46,99,.42)}
  .toc>summary{display:block;list-style:none;cursor:pointer;padding:14px 18px;
    color:var(--by-gold);font-size:.92rem;letter-spacing:.16em}
  .toc>summary::-webkit-details-marker{display:none}
  .toc>summary::after{content:"＋";float:right;color:var(--by-sky)}
  .toc[open]>summary::after{content:"－"}
  .toc b{display:none}
  .toc .list{max-height:46vh;overflow:auto;padding:0 12px 14px}
  .toc a{padding:8px 8px}
}
@media(max-width:820px){
  html{font-size:17px}
  body{line-height:1.92}
  article{padding:26px 20px;border-radius:14px}
  article h1{font-size:1.55rem;margin:34px 0 14px}
  article h2{font-size:1.24rem;margin:28px 0 12px}
  article h3{font-size:1.06rem;margin:22px 0 8px}
  article hr{margin:28px 0}
  blockquote.quote{padding:12px 16px}
  table{font-size:.92rem;min-width:360px}
  th,td{padding:9px 12px}
  footer{padding:32px 18px;text-align:left}
  .head h1{letter-spacing:.04em}
}

.gal{max-width:1180px;margin:0 auto;padding:20px 22px 90px;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:24px}
.pg{border:1px solid rgba(143,180,232,.2);border-radius:14px;overflow:hidden;background:#fff;transition:.3s}
.pg:hover{border-color:var(--by-gold);transform:translateY(-3px)}
.pg img{width:100%}
.pg figcaption{background:rgba(15,46,99,.72);color:var(--by-sky);font-size:.86rem;padding:10px 14px;text-align:center}
@media(max-width:820px){
  .gal{padding:14px 18px 70px;gap:16px;grid-template-columns:1fr}
  .pg figcaption{font-size:.9rem;padding:11px 14px}
  .tip{font-size:.92rem}
}
.tip{max-width:1180px;margin:0 auto;padding:0 22px;color:var(--by-sky);text-align:center;font-size:.9rem;opacity:.85}
</style>
</head>
